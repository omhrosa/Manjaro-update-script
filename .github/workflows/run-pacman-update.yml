name: Run one-shot pacman update

on:
  push:
    paths:
      - .github/workflows/run-pacman-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and publish pacman.sh
        shell: bash
        run: |
          awk '/^\/Td6WFo/{capture=1} capture && $0!="PAYLOAD"{print} /^PAYLOAD$/{exit}' .github/workflows/update-pacman-once.yml > /tmp/pacman.xz.b64
          base64 -d /tmp/pacman.xz.b64 | xz -d > pacman.sh
          test "$(git hash-object pacman.sh)" = "c824c6e728bb475308e33ac0c3970767395f5e24"
          rm -f .github/workflows/update-pacman-once.yml .github/workflows/run-pacman-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pacman.sh .github/workflows/update-pacman-once.yml .github/workflows/run-pacman-update.yml
          git commit -m "Update Manjaro maintenance script"
          git push origin HEAD:main
