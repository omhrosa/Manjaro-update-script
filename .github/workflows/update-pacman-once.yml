name: One-shot update pacman.sh

on:
  push:
    paths:
      - .github/workflows/update-pacman-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace pacman.sh with verified local version
        shell: bash
        run: |
          cat > /tmp/pacman.xz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/pacman.xz.b64 | xz -d > pacman.sh
          test "$(git hash-object pacman.sh)" = "c824c6e728bb475308e33ac0c3970767395f5e24"
          rm -f .github/workflows/update-pacman-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pacman.sh .github/workflows/update-pacman-once.yml
          git commit -m "Update Manjaro maintenance script"
          git push origin HEAD:main
